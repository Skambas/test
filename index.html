<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дякую за чайові ☕</title>
<meta name="theme-color" content="#a8957b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #a8957b;
    --bg-deep: #96836a;
    --paper: #f1e8d6;
    --ink: #4a3828;
    --ink-soft: #7a6450;
    --btn: #5b4330;
    --btn-text: #f1e8d6;
    --coffee: #4b2f1d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }
  [hidden] { display: none !important; }

  /* ---------- Гра ---------- */
  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }
  .title {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-weight: 700;
    font-size: clamp(32px, 9vw, 42px);
    line-height: 1.1;
    margin: 0;
    color: var(--paper);
    text-shadow: 0 2px 4px rgba(40,28,16,.3);
  }
  #stage {
    width: min(260px, 70vw);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    border-radius: 24px;
    outline-offset: 6px;
  }
  #stage:focus-visible { outline: 3px solid var(--paper); }
  #stage svg { display: block; width: 100%; height: auto; overflow: visible; }
  .hint {
    margin: 0;
    min-height: 1.4em;
    color: var(--paper);
    font-style: italic;
    font-size: 16px;
  }

  /* ---------- Результат ---------- */
  #result {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .caption {
    margin: 0;
    color: var(--paper);
    font-style: italic;
    font-size: 16px;
    text-align: center;
  }
  .note-wrap {
    width: 100%;
    filter: drop-shadow(0 10px 14px rgba(40,28,16,.35)) drop-shadow(0 2px 3px rgba(40,28,16,.25));
    transform: rotate(-1.6deg);
  }
  .note {
    background:
      repeating-linear-gradient(0deg, rgba(120,95,65,.045) 0 1px, transparent 1px 3px),
      var(--paper);
    padding: 56px 34px 52px;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  .note.drop { animation: drop .7s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes drop {
    from { transform: translateY(-28px) rotate(3deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .phrase {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-weight: 500;
    font-size: clamp(30px, 8vw, 40px);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  .phrase.long { font-size: clamp(24px, 6vw, 29px); }
  .phrase.mid  { font-size: clamp(27px, 7vw, 34px); }
  .sign {
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
    text-align: right;
  }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  button {
    appearance: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  button:active { transform: scale(.96); }
  .primary {
    background: var(--btn);
    color: var(--btn-text);
    font-size: 16px;
    padding: 13px 28px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(40,28,16,.3);
  }
  .primary:hover { background: #6c523d; }
  .ghost {
    background: none;
    color: var(--paper);
    font-size: 15px;
    padding: 6px 10px;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .note.drop { animation: none; }
  }
</style>
</head>
<body>
<main>

  <section id="game">
    <h1 class="title">Налий собі кави</h1>
    <div id="stage" tabindex="0" role="button" aria-label="Потримай, щоб налити каву">
      <svg viewBox="0 0 160 232" aria-hidden="true">
        <defs>
          <clipPath id="glass">
            <path d="M20 60 L140 60 L124 215 Q123 222 116 222 L44 222 Q37 222 36 215 Z"/>
          </clipPath>
        </defs>
        <!-- струмінь -->
        <rect id="stream" x="77" y="0" width="6" height="0" rx="3" fill="#4b2f1d"/>
        <!-- склянка -->
        <path d="M20 60 L140 60 L124 215 Q123 222 116 222 L44 222 Q37 222 36 215 Z"
              fill="rgba(241,232,214,.22)"/>
        <g clip-path="url(#glass)">
          <rect id="coffee" x="0" y="222" width="160" height="0" fill="#4b2f1d"/>
          <rect id="foam" x="0" y="222" width="160" height="5" fill="#8a6446" opacity="0"/>
        </g>
        <!-- відмітка "ідеально" -->
        <line x1="26" x2="134" y1="97" y2="97" stroke="#f1e8d6" stroke-width="1.5" stroke-dasharray="4 5" opacity=".75"/>
        <path d="M20 60 L140 60 L124 215 Q123 222 116 222 L44 222 Q37 222 36 215 Z"
              fill="none" stroke="#f1e8d6" stroke-width="3" stroke-linejoin="round"/>
        <!-- калюжка, якщо через край -->
        <ellipse id="puddle" cx="80" cy="226" rx="0" ry="4" fill="#4b2f1d" opacity=".7"/>
      </svg>
    </div>
    <p class="hint" id="hint">Потримай склянку, щоб налити каву</p>
  </section>

  <section id="result" hidden>
    <p class="caption" id="caption"></p>
    <div class="note-wrap">
      <div class="note" id="note" aria-live="polite">
        <p class="phrase" id="phrase"></p>
        <p class="sign" id="sign"></p>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="again" type="button">Ще одна</button>
      <button class="ghost" id="replay" type="button">Налити каву ще раз</button>
    </div>
  </section>

</main>

<script>
  const PHRASES = [
    "Дякую! Тримай віртуальне печиво. Воно без калорій 🍪",
    "Дуже дякую! Завжди приємно бачити Вас за стійкою.",
    "Закон фізики: енергія подяки не зникає, вона переходить у чайові баристі. Дякую за закон збереження позитиву! 🔬",
    "Дякую! Ви купили мені мотивацію працювати до завтра!",
    "🏆 Досягнення розблоковане: \"Щедрий гість\". Дякую!",
    "📈 Інвестуй у каву - вона завжди окупається гарним настроєм. Дякую за інвестицію!",
    "Дякую, що помітили, що за кавою стоїть людина 🤍",
    "Бариста сяє від щастя! Дякую!",
    "Такі гості, як Ви, - надихають! 🤍 🕯️",
    "Ви доклалися до вдалих вихідних баристи. Дякую!",
    "Дякую, ці гроші підуть на каву для мене, щоб варити ще кращу каву для Вас. Це замкнене коло!",
    "Усміхніться! Ви тільки що зробили день однієї баристи! 🦊 🍁",
    "Працюю на чистому ентузіазмі, але завдяки Вам тут з'явився ще й капітал",
    "🦸 Супергерої не завжди носять плащі. Деякі носять в руці стакан \"Хюґе\". Дякую!",
    "Дякую! До речі, праслов'янське dьkā означало \"думка\" або \"пам'ять\" - тож я Вас тепер запам'ятала.",
    "🇫🇷 Merci! Слово походить від латинського кореня, що означає \"милосердя\" та \"благодать\". Дякую, це так милосердно!",
    "🌸 Дякую! В японській мові подяка звучить як визнання чогось рідкісного і вартісного. Ваша підтримка сьогодні - саме така!",
    "🇮🇹 Grazie mille! Італійське слово grazie походить від латинського gratia, означає не лише подяку, а й «милість» та «витонченість/краса» (звідси ж і слово «грація»). Дякую, що додали сьогоднішньому дню трохи краси!"
  ];

  const SIGNATURE = "- Ваша бариста🦊 ☕";

  /* ---------- Подяка на листочку ---------- */
  const noteEl = document.getElementById('note');
  const phraseEl = document.getElementById('phrase');
  const signEl = document.getElementById('sign');
  let last = -1;

  function tornEdge() {
    const jag = (max) => Math.random() * max;
    const top = [], bottom = [];
    const steps = 22;
    for (let i = 0; i <= steps; i++) {
      const x = i / steps * 100;
      top.push(`${x.toFixed(2)}% ${jag(3.2).toFixed(2)}%`);
      bottom.push(`${(100 - x).toFixed(2)}% ${(100 - jag(3.2)).toFixed(2)}%`);
    }
    return `polygon(${top.join(',')},${bottom.join(',')})`;
  }

  function showNote() {
    let i;
    do { i = Math.floor(Math.random() * PHRASES.length); }
    while (PHRASES.length > 1 && i === last);
    last = i;

    const n = PHRASES[i].length;
    phraseEl.textContent = PHRASES[i];
    phraseEl.className = 'phrase' + (n > 130 ? ' long' : n > 80 ? ' mid' : '');
    signEl.textContent = SIGNATURE;
    noteEl.style.clipPath = tornEdge();

    noteEl.classList.remove('drop');
    void noteEl.offsetWidth;
    noteEl.classList.add('drop');
  }

  /* ---------- Гра: налий каву ---------- */
  const game = document.getElementById('game');
  const result = document.getElementById('result');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const caption = document.getElementById('caption');
  const coffee = document.getElementById('coffee');
  const foam = document.getElementById('foam');
  const stream = document.getElementById('stream');
  const puddle = document.getElementById('puddle');

  const BOTTOM = 222, HEIGHT = 162;   // геометрія склянки в SVG
  const FILL_SECONDS = 2.6;           // за скільки секунд склянка наповнюється повністю
  const MIN_OK = 0.6;                 // нижче цього рівня гра не завершується

  let level = 0, pouring = false, finished = false, raf = 0, prevT = 0;

  function draw() {
    const h = level * HEIGHT;
    const y = BOTTOM - h;
    coffee.setAttribute('y', y);
    coffee.setAttribute('height', h);
    foam.setAttribute('y', y);
    foam.setAttribute('opacity', level > 0.04 ? 0.9 : 0);
    // струмінь від верху до поверхні кави
    const sTop = 0;
    const sBottom = pouring ? (level > 0.02 ? y : BOTTOM) : sTop;
    stream.setAttribute('height', Math.max(0, sBottom - sTop));
  }

  function tick(t) {
    if (!pouring || finished) return;
    const dt = Math.min(0.05, (t - prevT) / 1000);
    prevT = t;
    level = Math.min(1, level + dt / FILL_SECONDS);
    draw();
    if (level >= 1) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }

  function startPour() {
    if (finished || pouring) return;
    pouring = true;
    hint.textContent = 'Лий… і відпусти біля пунктирної риски';
    prevT = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function stopPour() {
    if (!pouring) return;
    pouring = false;
    cancelAnimationFrame(raf);
    draw();
    if (level >= MIN_OK) finish();
    else hint.textContent = 'Ще трішки — потримай склянку';
  }

  function finish() {
    if (finished) return;
    finished = true;
    pouring = false;
    cancelAnimationFrame(raf);
    draw();

    let msg;
    if (level >= 0.97) {
      msg = 'Ой, через край! Це за рахунок закладу 😄';
      puddle.setAttribute('rx', 46);
    } else if (level >= 0.78) {
      msg = 'Ідеально! Рівно стільки, скільки треба ☕';
    } else {
      msg = 'Трохи не доверху, але теж смачно ☕';
    }
    hint.textContent = msg;
    caption.textContent = msg;

    setTimeout(() => {
      game.hidden = true;
      result.hidden = false;
      showNote();
    }, 1100);
  }

  function resetGame() {
    level = 0; finished = false; pouring = false;
    puddle.setAttribute('rx', 0);
    hint.textContent = 'Потримай склянку, щоб налити каву';
    draw();
    result.hidden = true;
    game.hidden = false;
  }

  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    startPour();
  });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, stopPour));
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  // Клавіатура: пробіл або Enter, для доступності
  stage.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startPour(); }
  });
  stage.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Enter') stopPour();
  });

  document.getElementById('again').addEventListener('click', showNote);
  document.getElementById('replay').addEventListener('click', resetGame);

  draw();
</script>
</body>
</html>
